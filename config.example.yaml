# Copied into the database on FIRST start only. After that, edit everything in the web UI
# (Settings page). Copy to config.yaml before `docker compose up`.
name: "House hunt 2027/28"
group_size: 5                 # hard limit: houses must have exactly this many bedrooms...
extra_bedrooms_allowed: 0     # ...plus this many spare rooms
min_bathrooms_per_person: 0.4    # 0.4 = 2 bathrooms for 5 people
unknown_bathrooms_ok: true

budget_pppw: 130              # £ per person per week INCLUDING bills
budget_buffer_pppw: 10        # still shown up to £140, but scored lower

target_move_in: 2027-07-01    # July is best...
earliest_move_in: 2027-06-01  # ...June is fine
latest_move_in: 2027-08-01
unknown_move_in_ok: true

furnished: furnished
preferred_areas: [Heaton, Jesmond, City Centre, Sandyford, Shieldfield, Spital Tongues]
max_distance_km: 5

people:
  - name: Tamair
    places:
      - label: Urban Sciences Building
        postcode: NE4 5TG
        lat: 54.9733
        lng: -1.6251
        mode: walk          # walk | cycle | transit | drive
        max_minutes: 25
        hard_limit: false
  - name: Medic           # rename to whoever is at the med school
    places:
      - label: Medical School
        postcode: NE2 4HH
        lat: 54.9800
        lng: -1.6210
        mode: walk
        max_minutes: 25

recipients:
  - name: Tamair
    email: you@example.com      # set your real address in config.yaml (not committed)
    digest_frequency: daily     # off | daily | twice_daily | weekly; skipped when nothing new
    digest_hour: 18
    instant_great: false        # true = also email straight away when a great place appears
    include_reminders: true
